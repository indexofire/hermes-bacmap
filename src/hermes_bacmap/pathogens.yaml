# 病原注册表 — 全部常见病原（阶段 1 推广）
# 语义约定见各字段注释；键序 = marker 鉴定优先级（先声明者优先）
# enabled: false 的病原不出现在任何查询表中（高后果/管制病原用）
pathogens:
  # ═══ 原有 4 病原 ═══
  Salmonella:
    display_name: 沙门菌
    species_label: Salmonella
    marker_genes: [inva]
    mlst_scheme: salmonella_2
    cgmlst_scheme: senterica_2
    amrfinder_organism: Salmonella
    serotype_engine: sistr
    snp_group: salmonella
  Shigella:
    display_name: 志贺菌
    species_label: Shigella/EIEC
    marker_genes: [ipah]
    mlst_scheme: ecoli_1
    cgmlst_scheme: ecoli_2
    amrfinder_organism: Escherichia
    serotype_engine: shigella
    snp_group: ecoli
  V.parahaemolyticus:
    display_name: 副溶血性弧菌
    species_label: V_parahaemolyticus
    marker_genes: [toxr, tlh]
    mlst_scheme: vparahaemolyticus_1
    cgmlst_scheme: vparahaemolyticus_3
    serotype_engine: vpa
    snp_group: vpara
  E.coli:
    display_name: 大肠埃希菌
    species_label: DEC
    marker_genes: [uida, lacy]
    mlst_scheme: ecoli_1
    cgmlst_scheme: ecoli_2
    amrfinder_organism: Escherichia
    serotype_engine: ecoh
    pathotype: dec
    snp_group: ecoli

  # ═══ P1 食源性/水源性 ═══
  "Vibrio cholerae":
    display_name: 霍乱弧菌
    marker_genes: [ompw, ctxa]
    mlst_scheme: vcholerae
    amrfinder_organism: Vibrio_cholerae
    snp_group: vcholerae
  "Listeria monocytogenes":
    display_name: 单增李斯特菌
    marker_genes: [hly, prs]
    mlst_scheme: listeria
    amrfinder_organism: Listeria_monocytogenes
    snp_group: listeria
  "Campylobacter jejuni":
    display_name: 空肠弯曲菌
    marker_genes: [mapa, cadf]
    mlst_scheme: campylobacter
    amrfinder_organism: Campylobacter
    snp_group: campylobacter
  "Campylobacter coli":
    display_name: 结肠弯曲菌
    marker_genes: [ceue]
    mlst_scheme: campylobacter
    amrfinder_organism: Campylobacter
    snp_group: campylobacter

  # ═══ P2 呼吸道 ═══
  "Streptococcus pneumoniae":
    display_name: 肺炎链球菌
    marker_genes: [lyta, psaa]
    mlst_scheme: spneumoniae
    amrfinder_organism: Streptococcus_pneumoniae
    snp_group: streptococcus
  "Neisseria meningitidis":
    display_name: 脑膜炎奈瑟菌
    marker_genes: [ctra, sodc]
    mlst_scheme: neisseria
    snp_group: neisseria
  "Legionella pneumophila":
    display_name: 嗜肺军团菌
    marker_genes: [mip, dota]
    mlst_scheme: legionella
    snp_group: legionella
  "Mycoplasma pneumoniae":
    display_name: 肺炎支原体
    marker_genes: [p1]
    snp_group: mpneumoniae
  "Haemophilus influenzae":
    display_name: 流感嗜血杆菌
    marker_genes: [hpd]
    mlst_scheme: haemophilus
    snp_group: haemophilus
  "Bordetella pertussis":
    display_name: 百日咳鲍特菌
    marker_genes: [is481, ptxs1]
    snp_group: bordetella

  # ═══ 条件致病/院感 ═══
  "Klebsiella pneumoniae":
    display_name: 肺炎克雷伯菌
    marker_genes: [khe]
    mlst_scheme: kpneumoniae
    amrfinder_organism: Klebsiella_pneumoniae
    snp_group: klebsiella
  "Acinetobacter baumannii":
    display_name: 鲍曼不动杆菌
    marker_genes: [oxa51]
    mlst_scheme: abaumannii
    amrfinder_organism: Acinetobacter_baumannii
    snp_group: acinetobacter
  "Pseudomonas aeruginosa":
    display_name: 铜绿假单胞菌
    marker_genes: [ecfx]
    mlst_scheme: paeruginosa
    amrfinder_organism: Pseudomonas_aeruginosa
    snp_group: pseudomonas
  "Staphylococcus aureus":
    display_name: 金黄色葡萄球菌
    marker_genes: [nuc, fema]
    mlst_scheme: saureus
    amrfinder_organism: Staphylococcus_aureus
    snp_group: staphylococcus
  "Enterococcus faecalis":
    display_name: 粪肠球菌
    marker_genes: [ddl-ef]
    mlst_scheme: efaecalis
    amrfinder_organism: Enterococcus_faecalis
    snp_group: enterococcus
  "Enterococcus faecium":
    display_name: 屎肠球菌
    marker_genes: [ddl-efm]
    mlst_scheme: efaecium
    amrfinder_organism: Enterococcus_faecium
    snp_group: enterococcus
  "Clostridioides difficile":
    display_name: 艰难梭菌
    marker_genes: [tcda, tcdb]
    mlst_scheme: cdifficile
    snp_group: cdifficile

  # ═══ 其他重要病原 ═══
  "Streptococcus pyogenes":
    display_name: 化脓链球菌
    marker_genes: [speb]
    mlst_scheme: spyogenes
    amrfinder_organism: Streptococcus_pyogenes
    snp_group: streptococcus
  "Streptococcus agalactiae":
    display_name: 无乳链球菌
    marker_genes: [cfb, dlrS]
    mlst_scheme: sagalactiae
    amrfinder_organism: Streptococcus_agalactiae
    snp_group: streptococcus
  "Neisseria gonorrhoeae":
    display_name: 淋病奈瑟菌
    marker_genes: [pora]
    mlst_scheme: ngonorrhoeae
    snp_group: neisseria
  "Helicobacter pylori":
    display_name: 幽门螺杆菌
    marker_genes: [urea, urec]
    mlst_scheme: hpylori
    snp_group: hpylori
  "Cronobacter sakazakii":
    display_name: 阪崎克罗诺杆菌
    marker_genes: [rpob-cs]
    mlst_scheme: cronobacter
    snp_group: cronobacter
  "Yersinia enterocolitica":
    display_name: 小肠结肠炎耶尔森菌
    marker_genes: [ail]
    mlst_scheme: yenterocolitica
    snp_group: yersinia
  "Aeromonas hydrophila":
    display_name: 嗜水气单胞菌
    marker_genes: [aera, ahh1]
    mlst_scheme: ahydrophila
    snp_group: aeromonas
  "Streptococcus suis":
    display_name: 猪链球菌
    marker_genes: [gdh]
    mlst_scheme: ssuis
    snp_group: streptococcus
  "Corynebacterium diphtheriae":
    display_name: 白喉棒状杆菌
    marker_genes: [tox]
    mlst_scheme: cdiphtheriae
    snp_group: corynebacterium

  # ═══ 高后果/管制（默认禁用） ═══
  "Yersinia pestis":
    display_name: 鼠疫耶尔森菌
    marker_genes: [caf1, pla]
    mlst_scheme: ypestis
    snp_group: yersinia
    enabled: false
  "Bacillus anthracis":
    display_name: 炭疽芽胞杆菌
    marker_genes: [paga, capb]
    mlst_scheme: banthracis
    snp_group: bacillus
    enabled: false
  "Burkholderia pseudomallei":
    display_name: 类鼻疽伯克霍尔德菌
    marker_genes: [tts1, bimabp]
    mlst_scheme: bpseudomallei
    snp_group: burkholderia
    enabled: false
  "Clostridium botulinum":
    display_name: 肉毒梭菌
    marker_genes: [bontA, bontB]
    snp_group: cbotulinum
    enabled: false

