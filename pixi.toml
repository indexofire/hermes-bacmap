[workspace]
authors = ["indexofire <indexofire@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "hermes-bacmap"
platforms = ["linux-64"]
version = "0.5.0"

[tasks]

[dependencies]
python = "3.12.*"
samtools = ">=1.20"
bwa = ">=0.7.17"
minimap2 = ">=2.28"
bcftools = ">=1.20"
blast = ">=2.16"
bedtools = ">=2.31"
seqkit = ">=2.8"
sra-tools = ">=3.0"
spades = ">=3.15"
openjdk = ">=11,<17"
shovill = ">=1.1.0,<2"
snakemake = "7.32.*"
sistr_cmd = ">=1.1.3,<2"
fastp = ">=1.3.5,<2"
abricate = ">=1.4.0,<2"
ncbi-amrfinderplus = "3.12.*"
iqtree = ">=3.1.2,<4"
prodigal = ">=2.6.3,<3"
kma = ">=1.4"
ncbi-datasets-cli = ">=16"
skani = "0.3.*"
kraken2 = ">=2.1"
bracken = ">=2.9"
mash = ">=2.3"

[pypi-dependencies]
gmlst = ">=0.1.4"
biopython = ">=1.83"
pydantic = ">=2.0"
pyrodigal = ">=3.0"
pyhmmer = ">=0.10"
mappy = ">=2.24"
sourmash = ">=4.8"

[feature.taxonomic.dependencies]
gtdbtk = "2.7.*"
checkm2 = "1.1.0.*"

# 独立环境：checkm2 的 conda 构建要求 python<3.9，与 default 的 3.12 冲突，
# 必须排除 default 特性（no-default-feature）；gtdbtk/checkm2 由 rule 直接调用，
# 无需 default 依赖。
[environments]
taxonomic = { features = ["taxonomic"], no-default-feature = true }
